<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birr Budget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Birr Budget</h1>
    <p class="tagline">Track what comes in and what goes out, in ETB.</p>
  </header>

  <main>
    <section id="form-section" aria-label="Add a transaction">
      <h2>Add a transaction</h2>
      <form id="entry-form" novalidate>
        <label for="description">Description</label>
        <input type="text" id="description" placeholder="e.g. Lunch at Firfir tera">

        <label for="amount">Amount (ETB)</label>
        <input type="number" id="amount" placeholder="0" min="0" step="0.01">

        <label for="type">Type</label>
        <select id="type">
          <option value="income">Income</option>
          <option value="expense" selected>Expense</option>
        </select>

        <label for="category">Category</label>
        <select id="category"></select>

        <button type="submit">Add transaction</button>
        <p id="form-error" role="alert"></p>
      </form>
    </section>

    <section id="list-section" aria-label="Transactions">
      <div class="list-header">
        <h2>Transactions</h2>
        <input type="text" id="search" placeholder="Search description or category...">
      </div>
      <p id="status">Loading categories...</p>
      <ul id="transaction-list"></ul>
    </section>

    <aside id="summary" aria-label="Summary">
      <h2>Summary</h2>
      <p class="summary-line">Income <span id="total-income">0</span> ETB</p>
      <p class="summary-line">Expenses <span id="total-expense">0</span> ETB</p>
      <p class="summary-line balance">Balance <span id="total-balance">0</span> ETB</p>
    </aside>
  </main>

  <footer>
    <p>Birr Budget &middot;</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
